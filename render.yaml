databases:
  - name: eduschedule-db
    plan: free
    databaseName: timetabling
    user: timetabling_user

services:
  - type: web
    name: eduschedule-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn eduschedule_backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eduschedule-db
          property: connectionString
